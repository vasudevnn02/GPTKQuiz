<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPTK Quiz Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --font-ny: "New York", -apple-system-ui-serif, ui-serif, "Newsreader", "Charter", Georgia, Cambria, serif;
      }
      *, *::before, *::after {
        box-sizing: border-box;
        font-family: var(--font-ny) !important;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #0c0e14;
        color: #ffffff;
        font-family: var(--font-ny) !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      button, input, select, textarea {
        font-family: var(--font-ny) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
